<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Rhombiverse</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    html, body { margin: 0; height: 100%; background: #05050a; overflow: hidden; }
    canvas { display: block; }
    #controls {
      position: fixed;
      top: 12px;
      left: 12px;
      color: #ddd;
      font: 13px/1.4 system-ui, sans-serif;
      background: rgba(0, 0, 0, 0.45);
      padding: 8px 12px;
      border-radius: 6px;
      user-select: none;
    }
    #controls input[type="number"] { width: 3em; }
    #controls select { font: inherit; }
    #controls .row { display: flex; align-items: center; gap: 10px; margin-top: 6px; }
    #controls .hint { opacity: 0.7; margin: 6px 0 0; max-width: 26em; }
    #controls .buttons { display: flex; gap: 6px; margin-top: 6px; }
    #controls button, #controls .file-btn {
      font: inherit;
      color: inherit;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 4px;
      padding: 4px 8px;
      cursor: pointer;
    }
    #controls button:hover, #controls .file-btn:hover { background: rgba(255, 255, 255, 0.2); }
    #controls button.mode-btn.active { background: rgba(120, 190, 255, 0.35); border-color: #7cf; }
  </style>
  <!--
    No bundler/build step by design (Grounded Simplicity, RHOMBIVERSE_PRINCIPLES.md
    section 0) -- plain ES modules + an import map, deployable as static files
    (GitHub Pages / Vercel, per RHOMBIVERSE_PLAN.md Phase 4) with zero build tooling.
  -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.185.1/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.185.1/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="app"></div>
  <div id="controls">
    <div class="row">
      <button class="mode-btn active" data-mode="build" type="button">Build</button>
      <button class="mode-btn" data-mode="fill" type="button">Fill</button>
      <button class="mode-btn" data-mode="round" type="button">Round</button>
      <button class="mode-btn" data-mode="excavate" type="button">Excavate</button>
    </div>
    <div class="row">
      <label>Material:
        <select id="material-select">
          <option value="base">Base Rhomb</option>
          <option value="garnet">Garnet</option>
          <option value="ferrostone">Ferrostone</option>
          <option value="glassite">Glassite</option>
          <option value="star-glassite">Star-Glassite</option>
          <option value="blackstar-glassite">Blackstar-Glassite</option>
          <option value="ice99">Ice 9.9</option>
          <option value="water">Water</option>
        </select>
      </label>
    </div>
    <div class="row">
      <label>Shell fill radius: <input id="shell-count" type="number" min="1" max="10" value="3" /></label>
      <label>Hollow from shell: <input id="hollow-from" type="number" min="1" max="10" value="1" /></label>
    </div>
    <div class="row">
      <label><input id="section-enable" type="checkbox" /> Section view</label>
      <select id="section-axis">
        <option value="x">X</option>
        <option value="y">Y</option>
        <option value="z">Z</option>
      </select>
      <input id="section-pos" type="range" min="-20" max="20" step="0.5" value="0" />
      <label><input id="section-flip" type="checkbox" /> Flip</label>
    </div>
    <div class="row">
      <label>Onion skin shells:
        <input id="onion-min" type="number" min="0" value="0" /> to
        <input id="onion-max" type="number" min="0" value="999" />
      </label>
    </div>
    <div class="hint">
      Click acts per the selected mode above (Build adds one cell; Fill/
      Round/Excavate use the shell inputs and only apply to shell-tagged
      structures). Right-click always removes the clicked cell, in every
      mode.
    </div>
    <div class="buttons">
      <button id="new-world" type="button">New World</button>
      <button id="export-json" type="button">Export JSON</button>
      <label class="file-btn">
        Import JSON
        <input id="import-json" type="file" accept="application/json" hidden />
      </label>
    </div>
  </div>
  <script type="module" src="./src/render.js"></script>
</body>
</html>

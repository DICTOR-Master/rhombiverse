<svg xmlns="http://www.w3.org/2000/svg" viewBox="-45 -45 90 90" width="64" height="64">
  <!--
    Wireframe rhombic dodecahedron: this project's own voxel shape, not
    generic art. Edge/vertex coordinates computed directly from
    lattice.js's real rdRawVerts (8 cube verts at radius 0.5, 6 octa
    verts at radius 1.0, the same 2:1 ratio the actual game geometry
    uses), rotated to a non-axis-aligned angle and orthographically
    projected so no vertex overlaps another on screen. See
    src/welcome.js for the same coordinates reused as the in-app logo.
    Redrawn 2026-08-23 to a shallower/more oblique angle (rx=20 ry=40
    rz=30) with muted, uniform-weight styling, per a direct reference image.
  -->
  <rect x="-45" y="-45" width="90" height="90" rx="16" fill="#10141f" />
  <g stroke="#6fb3d9" stroke-width="1.5" stroke-linecap="round" fill="none">
    <path d="M -20.99 25.56 L -25.83 14.91" />
    <path d="M -20.99 25.56 L 10.88 35.97" />
    <path d="M -20.99 25.56 L -27.03 0.23" />
    <path d="M 6.04 25.33 L -25.83 14.91" />
    <path d="M 6.04 25.33 L 10.88 35.97" />
    <path d="M 6.04 25.33 L 27.03 -0.23" />
    <path d="M -31.87 -10.41 L -25.83 14.91" />
    <path d="M -31.87 -10.41 L -10.88 -35.97" />
    <path d="M -31.87 -10.41 L -27.03 0.23" />
    <path d="M -4.84 -10.64 L -25.83 14.91" />
    <path d="M -4.84 -10.64 L -10.88 -35.97" />
    <path d="M -4.84 -10.64 L 27.03 -0.23" />
    <path d="M 4.84 10.64 L 25.83 -14.91" />
    <path d="M 4.84 10.64 L 10.88 35.97" />
    <path d="M 4.84 10.64 L -27.03 0.23" />
    <path d="M 31.87 10.41 L 25.83 -14.91" />
    <path d="M 31.87 10.41 L 10.88 35.97" />
    <path d="M 31.87 10.41 L 27.03 -0.23" />
    <path d="M -6.04 -25.33 L 25.83 -14.91" />
    <path d="M -6.04 -25.33 L -10.88 -35.97" />
    <path d="M -6.04 -25.33 L -27.03 0.23" />
    <path d="M 20.99 -25.56 L 25.83 -14.91" />
    <path d="M 20.99 -25.56 L -10.88 -35.97" />
    <path d="M 20.99 -25.56 L 27.03 -0.23" />
  </g>
  <g fill="#9fd0ec">
    <circle cx="-20.99" cy="25.56" r="2.6" />
    <circle cx="6.04" cy="25.33" r="2.6" />
    <circle cx="-31.87" cy="-10.41" r="2.6" />
    <circle cx="-4.84" cy="-10.64" r="2.6" />
    <circle cx="4.84" cy="10.64" r="2.6" />
    <circle cx="31.87" cy="10.41" r="2.6" />
    <circle cx="-6.04" cy="-25.33" r="2.6" />
    <circle cx="20.99" cy="-25.56" r="2.6" />
  </g>
  <g fill="#6fb3d9">
    <circle cx="25.83" cy="-14.91" r="3.0" />
    <circle cx="-25.83" cy="14.91" r="3.0" />
    <circle cx="-10.88" cy="-35.97" r="3.0" />
    <circle cx="10.88" cy="35.97" r="3.0" />
    <circle cx="27.03" cy="-0.23" r="3.0" />
    <circle cx="-27.03" cy="0.23" r="3.0" />

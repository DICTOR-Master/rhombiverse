<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>How to use Rhombiverse</title>
  <meta name="description" content="How to use Rhombiverse: place, remove and view space-filling shapes on real lattices in 2D, 3D and 4D, plus a reference for every control." />
  <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
  <style>
    html, body { margin: 0; background: #0a0c14; }
    body { padding: 24px 16px 64px; }
    .back { display: block; max-width: 760px; margin: 0 auto 20px; font: 14px system-ui, sans-serif; color: #9de0ff; }
  </style>
</head>
<body>
  <a class="back" href="./">&larr; Open Rhombiverse</a>
  <main class="md-guide">Loading…</main>
  <script type="module">
    import { renderMarkdown, GUIDE_CSS } from './src/app/markdown.js';
    const style = document.createElement('style');
    style.textContent = GUIDE_CSS;
    document.head.appendChild(style);
    const main = document.querySelector('main');
    fetch('./docs/guide.md')
      .then((r) => (r.ok ? r.text() : Promise.reject(new Error(`HTTP ${r.status}`))))
      .then((md) => {
        main.innerHTML = renderMarkdown(md);
        if (location.hash) document.getElementById(decodeURIComponent(location.hash.slice(1)))?.scrollIntoView();
      })
      .catch(() => { main.textContent = 'The guide could not be loaded. Check your connection and try again.'; });
  </script>
</body>
</html>
